name: Daily Publish

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HALOPSA_BASE_URL: ${{ secrets.HALOPSA_BASE_URL }}
      HALOPSA_CLIENT_ID: ${{ secrets.HALOPSA_CLIENT_ID }}
      HALOPSA_CLIENT_SECRET: ${{ secrets.HALOPSA_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Refresh snapshot and site
        run: npm run publish:daily
      - name: Commit refreshed snapshot
        id: snapshot_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/latest.json data/snapshots/history
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "snapshot_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh daily stats snapshot"
            git push
            echo "snapshot_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish site to gh-pages branch
        id: branch_deploy
        run: |
          git fetch origin gh-pages --depth=1 || true
          rm -rf ../msp-stats-gh-pages
          if git rev-parse --verify origin/gh-pages; then
            git worktree add -B gh-pages ../msp-stats-gh-pages origin/gh-pages
          else
            git worktree add --detach ../msp-stats-gh-pages
            git -C ../msp-stats-gh-pages switch --orphan gh-pages
          fi
          find ../msp-stats-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. ../msp-stats-gh-pages/
          touch ../msp-stats-gh-pages/.nojekyll
          git -C ../msp-stats-gh-pages add --all
          if git -C ../msp-stats-gh-pages diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git -C ../msp-stats-gh-pages commit -m "chore: publish site"
            git -C ../msp-stats-gh-pages push origin gh-pages
          fi
