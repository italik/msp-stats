name: Daily Publish

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Build and deploy the committed snapshot without refreshing data"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_only == true }}
      HALOPSA_BASE_URL: ${{ secrets.HALOPSA_BASE_URL }}
      HALOPSA_CLIENT_ID: ${{ secrets.HALOPSA_CLIENT_ID }}
      HALOPSA_CLIENT_SECRET: ${{ secrets.HALOPSA_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Refresh snapshot and site
        if: env.DEPLOY_ONLY != 'true'
        run: npm run publish:daily
      - name: Commit refreshed snapshot
        id: snapshot_commit
        if: env.DEPLOY_ONLY != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/latest.json data/snapshots/history
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "snapshot_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh daily stats snapshot"
            git push
            echo "snapshot_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch deploy-only run
        if: env.DEPLOY_ONLY != 'true' && steps.snapshot_commit.outputs.snapshot_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-publish.yml --ref main -f deploy_only=true
      - name: Build committed snapshot
        if: env.DEPLOY_ONLY == 'true'
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: env.DEPLOY_ONLY == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_only == true
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
